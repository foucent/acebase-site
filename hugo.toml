baseURL = 'https://acebase.cc/'
defaultContentLanguage = 'zh-cn'
languageCode = 'zh-cn'
title = 'AceBase | 硬核玩家基地'
theme = 'pehtheme-hugo'

[params]
description = 'AceBase 硬核玩家基地：CS2 / VALORANT 选手配置、电竞深度教程与前沿硬件调优。'
mainSections = ['posts']

[[menu.main]]
    name = "所有文章"
    url = "/posts/"
    weight = 1

[[menu.main]]
    name = "标签分类"
    url = "/tags/"
    weight = 2

# 1. 开启 Emoji 解析（解决 💡, 🛠️ 等小图标无法渲染的问题）
enableEmoji = true

# 2. 避免 Markdown 里的特殊标点被自动转义（防止 [Player Facing Direction] 等被拆散）
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      typographer = false
    [markup.goldmark.renderer]
      unsafe = true

[params.cusdis]
host = "https://cusdis.com"
appId = "58f9207e-554d-4f64-85b1-130a693eeb78"
lang = "zh-CN"