site_name: AceBase
site_url: https://acebase.cc/
repo_url: https://acebase.cc/
repo_name: AceBase
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    repo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          theme:
            language: zh
        - locale: en
          name: English
          build: true
          theme:
            language: en
          nav_translations:
            home: Home
            如何下单: How to Order
            价格与货源: Pricing & Sourcing
            FAQ 与更新: FAQ & Updates
            发货与到账: Delivery
            PUBG Mobile 直充: PUBG Mobile Top-Up
            PUBG G-COIN CDK: PUBG G-COIN CDK
            暗区突围点券: Arena Breakout Bonds
            三角洲行动充值: Delta Force Top-Up
            王者荣耀国际服充值: Honor of Kings Top-Up
            MLBB 钻石充值: MLBB Diamonds
            加速器横评: VPN Reviews
            图片墙: Photo Wall
            关于与政策: About & Policies
            关于我们: About Us
            联系我们: Contact Us
            支持: Support
            退款与退货: Return Policy
            发货政策: Shipping Policy
            反洗钱与反恐融资: AML / CTF Policy
            服务条款: Terms of Use

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/offgamers-pubg.css
  - stylesheets/bittopup-product.css
  - stylesheets/preowned.css
  - stylesheets/photo-wall.css

extra_javascript:
  - javascripts/currency.js
  - javascripts/crisp.js
  - javascripts/hero-slides.js
  - javascripts/photo-wall.js

watch:
  - overrides

extra:
  analytics:
    provider: google
    property: G-Q77Y59HQ7K
  social:
    - icon: material/controller-classic
      link: https://acebase.cc/
      name: AceBase

nav:
  - home: index.md
  - PUBG Mobile 直充: topup/pubg-mobile-direct.md
  - PUBG G-COIN CDK: topup/pubg-gcoin.md
  - 暗区突围点券: topup/arena-breakout-bonds.md
  - 三角洲行动充值: topup/delta-force.md
  - 王者荣耀国际服充值: topup/honor-of-kings.md
  - MLBB 钻石充值: topup/mlbb-diamonds.md
  - 加速器横评: vpn-reviews.md
  - 图片墙: figure-wall.md
  - 关于与政策:
      - 如何下单: shop/how-to-order.md
      - 价格与货源: shop/pricing-and-sourcing.md
      - FAQ 与更新: shop/faq-and-updates.md
      - 发货与到账: shop/shipping-and-delivery.md
      - 关于我们: legal/about.md
      - 联系我们: legal/contact.md
      - 支持: legal/support.md
      - 退款与退货: legal/return-policy.md
      - 发货政策: legal/shipping-policy.md
      - 反洗钱与反恐融资: legal/aml-policy.md
      - 服务条款: legal/terms-of-use.md
