site_name: AceBase
site_url: https://acebase.cc/
# Rendered by Material's partials/copyright.html in the footer bar.
copyright: © 2026 AceBase.cc. All rights reserved.
theme:
  name: material
  custom_dir: overrides
  language: zh
  # Material otherwise emits a <link> to Google Fonts for Roboto / Roboto Mono
  # on every page. The theme is built on system stacks instead, and the site is
  # read mainly from mainland China, where that request just stalls.
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    logo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - minify:
      # HTML minification strips attribute quotes, breaking data-gallery JSON
      # attributes used by the photo-wall lightbox. Keep CSS/JS minify only.
      minify_html: false
      minify_css: true
      minify_js: true
  - redirects:
      redirect_maps:
        board-games.md: gallery/index.md
        peripherals.md: gallery/index.md
        keyboards.md: gallery/index.md
        keycaps.md: gallery/index.md
        mousepads.md: gallery/index.md
        gallery/wallpapers.md: gallery/index.md
        gallery/peripherals.md: gallery/index.md
        gallery/figures.md: gallery/index.md
        gallery/coser.md: gallery/index.md
        gallery/pre-owned.md: gallery/index.md
        games/honor-of-kings.md: games/hok.md
        games/steam-accounts.md: index.md
        games/valorant-accounts.md: index.md
        currency/index.md: index.md
        games/buy-robux.md: index.md
        games/rtx-5050.md: games/gpu-prices.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/header.css
  - stylesheets/bittopup-product.css
  - stylesheets/preowned.css
  - stylesheets/photo-wall.css
  - stylesheets/home.css
  - stylesheets/board-games.css
  - stylesheets/games.css
  - stylesheets/gift-cards.css
  - stylesheets/gpu.css
  # Loads last: the magazine homepage owns the widest-reaching selectors, so
  # it should win any specificity tie against the per-page sheets above.
  - stylesheets/uncrate.css

extra_javascript:
  - javascripts/crisp.js
  - javascripts/hero-slides.js
  - javascripts/photo-wall.js
  - javascripts/gallery-lightbox.js
  - javascripts/board-cart.js
  - javascripts/board-grid.js
  - javascripts/gift-cards.js
  - javascripts/games-prices.js
  - javascripts/live-prices.js

watch:
  - overrides

extra:
  # Snipcart v3 public API key (Test key while testing; Live key after going live).
  # Get it at https://app.snipcart.com → Account → API keys.
  # See https://docs.snipcart.com/v3/testing/going-live
  snipcart_public_key: "MjA4M2Y2NmMtMjBmNi00Y2Q4LThlNzYtNDA1ZDhlNTU0OTQ2NjM5MjAxNTQ1NTQwOTM1OTI4"
  analytics:
    provider: google
    property: G-N7QW2VCWYG
  # uncrate's family row, in the black band above the wordmark: the sibling
  # sites, then the handle whose menu drops the channels. Labels go through
  # text-transform: uppercase, so write them in the brand's own casing.
  # `link` takes a full URL or a site-root path.
  family:
    - label: AceBase.cc
      link: https://acebase.cc/
    # 站内的 SHOP 页（gift-cards/index.md）。shop.acebase.cc 解析不了，
    # 子域开通后把 link 换成 https://shop.acebase.cc/ 即可。
    - label: shop.AceBase.cc
      link: /gift-cards/
  # The site's own channels, read twice: header.html renders them as the menu
  # under the @AceBase handle, main.html as the Organization node's sameAs. One
  # list, so a channel cannot show up in the menu without also being declared to
  # crawlers. `name` is the label; the @ is added by the template.
  #
  # Deliberately NOT named `social`: Material prints extra.social as a row of
  # icons in the footer, and the footer carries the copyright line alone.
  channels:
    - link: https://www.youtube.com/@acebase.select
      name: acebase.select
    - link: https://www.youtube.com/@AceBase_cc
      name: AceBase_cc
    - link: https://www.youtube.com/@经典好车
      name: 经典好车
  # Material's footer prints "Made with Material for MkDocs" after the copyright
  # unless this is false.
  generator: false

nav:
  - HOME: index.md
  - TECH: games/gpu-prices.md
  - GAME: games/topup-prices.md
  - APP: games/live-prices.md
  - GEAR: pc-components/index.md
  - STYLE: sim-gear/index.md
  - SHOP: gift-cards/index.md
