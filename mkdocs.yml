site_name: AceBase
site_url: https://acebase.cc/
repo_url: https://acebase.cc/
repo_name: AceBase
theme:
  name: material
  custom_dir: overrides
  language: custom
  palette:
    scheme: default
    primary: teal
    accent: teal
  icon:
    repo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections

plugins:
  - search

markdown_extensions:
  - toc
  - tables
  - fenced_code
  - md_in_html

extra_css:
  - stylesheets/extra.css
  - stylesheets/player-settings.css

extra_javascript:
  - javascripts/gallery-lightbox.js

watch:
  - overrides

extra:
  social:
    - icon: material/controller-classic
      link: https://acebase.cc/
      name: AceBase

nav:
  - Home: index.md
  - Player Settings:
      - "aspas": players/aspas.md
      - "donk": players/donk.md
      - "kyousuke": players/kyousuke.md
      - "m0NESY": players/m0nesy.md
      - "NiKo": players/niko.md
      - "ropz": players/ropz.md
      - "s1mple": players/s1mple.md
      - "TenZ": players/tenz.md
      - "XANTARES": players/xantares.md
      - "ZmjjKK": players/zmjjkk.md
      - "ZywOo": players/zywoo.md
  - Guides & Articles:
      - "7 CS2 Trivia Facts You Definitely Never Noticed!": guides/cs2-trivia-facts.md
      - "7 CS2 Trivia Facts You Definitely Never Noticed!": guides/model-notes.md
      - "AK vs Galil: The Most Heartbreaking Economic Paradox in CS2": guides/ak-vs-galil.md
      - "Cache Map Complete Guide: From the 'Forklift' Nickname to Callout Slang — Zero to Hero": guides/cache-map-complete-guide.md
      - "CS2 R8 Revolver: The Anti-Human Charging 'Wheelchair God": guides/cs2-r8-revolver.md
      - "CS2's Hidden Truths: 8 Overlooked Competitive Details Analyzed": guides/cs2-hardcore-details.md
      - "CS2's Three Dark Features: Decoding the Scalping Ecosystem, Cheat Tolerance, and Internet Cafe Ban": guides/cs2-three-dark-features.md
      - "How Much Do You Actually Lose Opening Terminal Crates? Classic Cases Are the Rational Player's Way": guides/terminal-crates-vs-classic-cases.md
      - "miHoYo's First UE5 Realistic Fantasy Epic: Ambition and Challenges Behind Zero Marketing": guides/mihoyo-ue5-first-look.md
      - "The Hidden Rhythm of AK Spray Control: The 'Don't Compensate for the First Two Shots' Rule That 90% of Newbies Get Wrong": guides/ak-spray-control.md
      - "ZOWIE New Mousepad Makes Professional Debut: The True Verification Path of Esports Peripherals": guides/zowie-mousepad-debut.md
