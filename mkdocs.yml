site_name: AceBase
site_url: https://acebase.cc/
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    logo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - redirects:
      redirect_maps:
        board-games.md: mousepads.md
        en/board-games.md: en/mousepads.md
        peripherals.md: mousepads.md
        en/peripherals.md: en/mousepads.md
        keyboards.md: mousepads.md
        en/keyboards.md: en/mousepads.md
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          theme:
            language: zh
        - locale: en
          name: English
          build: true
          theme:
            language: en
          nav_translations:
            home: Home
            FAQ 与更新: FAQ & Updates
            发货与到账: Delivery
            PUBG Mobile UC 代充: PUBG Mobile UC Proxy Top-Up
            PUBG G-COIN CDK 代充: PUBG G-COIN CDK Proxy Top-Up
            暗区突围点券代充: Arena Breakout Proxy Top-Up
            三角洲行动代充: Delta Force Proxy Top-Up
            王者荣耀国际服代充: Honor of Kings Proxy Top-Up
            使命召唤冷战兑换码: COD Black Ops Cold War Codes
            鼠标垫: Mousepads
            键帽: Keycaps
            相册: Gallery
            关于与政策: About & Policies
            退款与退货: Return Policy
            反洗钱与反恐融资: AML / CTF Policy
            服务条款: Terms of Use

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/offgamers-pubg.css
  - stylesheets/bittopup-product.css
  - stylesheets/preowned.css
  - stylesheets/photo-wall.css
  - stylesheets/home.css
  - stylesheets/board-games.css

extra_javascript:
  - javascripts/currency.js
  - javascripts/crisp.js
  - javascripts/hero-slides.js
  - javascripts/photo-wall.js
  - javascripts/gallery-lightbox.js
  - javascripts/board-cart.js
  - javascripts/board-grid.js

watch:
  - overrides

extra:
  # Snipcart v3 public API key (Test key while testing; Live key after going live).
  # Get it at https://app.snipcart.com → Account → API keys.
  # See https://docs.snipcart.com/v3/testing/going-live
  snipcart_public_key: "MjA4M2Y2NmMtMjBmNi00Y2Q4LThlNzYtNDA1ZDhlNTU0OTQ2NjM5MjAxNTQ1NTQwOTM1OTI4"
  analytics:
    provider: google
    property: G-Q77Y59HQ7K
  social:
    - icon: material/controller-classic
      link: https://acebase.cc/
      name: AceBase

nav:
  - home: index.md
  - PUBG Mobile UC 代充: topup/pubg-mobile-direct.md
  - PUBG G-COIN CDK 代充: topup/pubg-gcoin.md
  - 暗区突围点券代充: topup/arena-breakout-bonds.md
  - 三角洲行动代充: topup/delta-force.md
  - 王者荣耀国际服代充: topup/honor-of-kings.md
  - 使命召唤冷战兑换码: topup/cod-black-ops-cold-war.md
  - 鼠标垫: mousepads.md
  - 键帽: keycaps.md
  - 相册: gallery.md
