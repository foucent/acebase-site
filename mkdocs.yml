site_name: AceBase
site_url: https://acebase.cc/
# Rendered by Material's partials/copyright.html in the footer bar.
copyright: © 2026 AceBase.cc. All rights reserved.
theme:
  name: material
  custom_dir: overrides
  language: zh
  # Material otherwise emits a <link> to Google Fonts for Roboto / Roboto Mono
  # on every page. The theme is built on system stacks instead, and the site is
  # read mainly from mainland China, where that request just stalls.
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    logo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - minify:
      # HTML minification strips attribute quotes, breaking data-gallery JSON
      # attributes used by the photo-wall lightbox. Keep CSS/JS minify only.
      minify_html: false
      minify_css: true
      minify_js: true
  - redirects:
      redirect_maps:
        board-games.md: gallery/index.md
        peripherals.md: gallery/index.md
        keyboards.md: gallery/index.md
        keycaps.md: gallery/index.md
        mousepads.md: gallery/index.md
        gallery/wallpapers.md: gallery/index.md
        gallery/peripherals.md: gallery/index.md
        gallery/figures.md: gallery/index.md
        gallery/coser.md: gallery/index.md
        gallery/pre-owned.md: gallery/index.md
        games/honor-of-kings.md: topup/index.md
        games/steam-accounts.md: index.md
        games/valorant-accounts.md: index.md
        currency/index.md: index.md
        games/buy-robux.md: index.md
        # 显卡相关的十个旧 URL 2026-09-22 起全部指 /games/gpu-deals/ —— /tech/ 从
        # 这一天起是电竞房与桌搭实拍图集，不再讲任何显卡价，全站还在讲显卡价的
        # 只剩这一页。下面八个型号页是 2026-09-21 下线的，当初指回当时的总览页。
        games/rtx-5050.md: games/gpu-deals.md
        games/gpu-prices.md: games/gpu-deals.md
        games/rtx-5060.md: games/gpu-deals.md
        games/rtx-5060-ti.md: games/gpu-deals.md
        games/rtx-4070-ti-super.md: games/gpu-deals.md
        games/rtx-4080.md: games/gpu-deals.md
        games/rtx-4080-super.md: games/gpu-deals.md
        games/rtx-4090.md: games/gpu-deals.md
        games/rtx-3060.md: games/gpu-deals.md
        games/rtx-3060-ti.md: games/gpu-deals.md
        # 代储价格页 2026-09-21 从 /games/topup-prices/ 提到顶层 /topup/，
        # 和 /tech/ 并列。旧 URL 指过去，免得留下 404。
        games/topup-prices.md: topup/index.md
        # 五个游戏详情页 2026-09-21 下线 —— /topup 的卡片自己就把档位和价格列全了，
        # 详情页只是同一份数据的第二个入口。旧 URL 指回总览页对应那张卡的锚点。
        games/pubg-mobile.md: topup/index.md
        games/pubg-gcoin.md: topup/index.md
        games/hok.md: topup/index.md
        games/arena-breakout.md: topup/index.md
        games/where-winds-meet.md: topup/index.md
        # （`gift-cards/index.md: topup/index.md` 那条 2026-09-21 留在这一行，
        #   2026-09-24 删掉了 —— 礼品卡从 /topup/ 的第二段搬出来，在同一个 URL
        #   上重新立成自己的类目，这个地址又有真页面了。）
        # 直播代储页 2026-09-21 整页下线 —— 十四个平台按同一张模板重排，成了
        # /topup 的第三段；这一页的生成器、渲染器、样式和数据文件一并退休，
        # 价格改由 prices.json 供。旧 URL 指过去。
        games/live-prices.md: topup/index.md
        # 旧 FAQ 页（f8b7ba5 随 shop 目录一起下线）一直没人接手，URL 是 404；
        # /faq/ 是它的继任者，指过去。
        shop/faq-and-updates.md: faq/index.md
        # /car/ 2026-09-22 并入当时的 /sim-gear/（后来叫 /style/）—— 汽车实拍
        # 图集不再单独成类目，六张卡进了那一页的同一个网格。这一行当时指回首页
        # 是一处旧账（六张卡在 /style/ 上，指 style/index.md 才能让 /car/#car-01
        # 落到 car-01 那张卡）。2026-09-24 这笔账自己结了：STYLE 整页改成了
        # Gift Cards，十五张图集卡连图一起离开站点，car-01…06 哪儿都不在了 ——
        # 指首页现在是对的目标。
        car/index.md: index.md
        # /style/ 2026-09-24 整页让位 —— STYLE（穿搭写真 9 套 + 汽车实拍 6 套的
        # 图集）被用户改名成 Gift Cards，原来的十五张卡与 docs/assets/gallery/
        # 下的图一并撤掉，页面在同一个目录上重写成礼品卡（docs/gift-cards/）。
        # 那十五张卡连同锚点全没了，指回首页 —— 跟 /wellness/ 同一种处置：
        # 谁跟过来都找不到原来的照片，至少不落在 404 上。
        style/index.md: index.md
        # /sim-gear/ 2026-09-23 改名 /style/，2026-09-24 那页又整个换成了
        # Gift Cards。当初改指 style/index.md 是为了让 /sim-gear/#style-05
        # 落到那张卡上（mkdocs-redirects 的存根会**带着锚点**跳：
        # `location.href = "../style/" + (anchor ? "#" + anchor : "")`，
        # 浏览器实测 /sim-gear/#style-05 → /style/#style-05）—— 那些锚点现在
        # 不在了，所以跟着 /style/ 一起指首页。
        sim-gear/index.md: index.md
        # /gear/ 2026-09-24 整页让位 —— GEAR（乒乓球拍与装备实拍 11 组 67 张）被
        # 用户改名成 CDKeys，原来的十一张图集卡与 docs/assets/gallery/gear/ 下的
        # 67 张图一并撤掉，页面在同一个目录上重写成充值卡（docs/cdkeys/）。
        # 那些卡连同锚点全没了，指回首页 —— 跟 /style/、/wellness/ 同一种处置。
        gear/index.md: index.md
        # /wellness/ 2026-09-22 删除 —— 「健康生活」筹备页从没有过卡片，也没上过
        # 首页，没有内容可以搬。
        wellness/index.md: index.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/header.css
  - stylesheets/preowned.css
  - stylesheets/photo-wall.css
  - stylesheets/home.css
  - stylesheets/board-games.css
  - stylesheets/games.css
  - stylesheets/gift-cards.css
  # gpu.css was retired 2026-09-21 with the /games/live-prices/ page: the only
  # class left in it, .mg-gpu-models, was that page's anchor-pill row.
  # Loads last: the magazine homepage owns the widest-reaching selectors, so
  # it should win any specificity tie against the per-page sheets above.
  - stylesheets/uncrate.css

extra_javascript:
  - javascripts/crisp.js
  - javascripts/hero-slides.js
  - javascripts/photo-wall.js
  - javascripts/gallery-lightbox.js
  - javascripts/board-cart.js
  - javascripts/board-grid.js
  - javascripts/gift-cards.js
  # live-prices.js was retired 2026-09-21 with the page it served: its
  # .ab-ec-list[data-product] targets are gone and /topup renders every card,
  # these fourteen included, through games-prices.js.
  - javascripts/games-prices.js

watch:
  - overrides

extra:
  # Snipcart v3 public API key (Test key while testing; Live key after going live).
  # Get it at https://app.snipcart.com → Account → API keys.
  # See https://docs.snipcart.com/v3/testing/going-live
  snipcart_public_key: "MjA4M2Y2NmMtMjBmNi00Y2Q4LThlNzYtNDA1ZDhlNTU0OTQ2NjM5MjAxNTQ1NTQwOTM1OTI4"
  analytics:
    provider: google
    property: G-N7QW2VCWYG
  # uncrate's family row, in the black band above the wordmark: the sibling
  # sites. header.html renders the chat opener after them. Labels go through
  # text-transform: uppercase, so write them in the brand's own casing.
  # `link` takes a full URL or a site-root path.
  family:
    - label: AceBase.cc
      link: https://acebase.cc/
    # 站内的礼品卡专区 —— 2026-09-21 起是 /topup/ 的第二段，2026-09-24 起
    # 礼品卡搬出来自己成了一个类目 /gift-cards/，这一格跟着改指那边。
    # shop.acebase.cc 解析不了，子域开通后把 link 换成
    # https://shop.acebase.cc/ 即可。
    - label: shop.AceBase.cc
      link: /gift-cards/
  # The site's own channels, read once, by main.html, which declares them as
  # the Organization node's sameAs. header.html used to render them as a menu
  # under the @AceBase handle in the family row; since 2026-09-23 that handle
  # opens the chat window instead, so nothing on the page lists them any more —
  # a crawler still learns them, a visitor no longer sees them. `name` is the
  # label.
  #
  # Deliberately NOT named `social`: Material prints extra.social as a row of
  # icons in the footer, and the footer carries the copyright line alone.
  channels:
    - link: https://www.youtube.com/@acebase.select
      name: acebase.select
    - link: https://www.youtube.com/@AceBase_cc
      name: AceBase_cc
    - link: https://www.youtube.com/@经典好车
      name: 经典好车
  # Material's footer prints "Made with Material for MkDocs" after the copyright
  # unless this is false.
  generator: false

nav:
  - HOME: index.md
  - TECH: tech/index.md
  - TOP-UP: topup/index.md
  # 2026-09-24 改名：这一格原来叫 STYLE，装着穿搭写真 9 套与汽车实拍 6 套两个
  # 图集（2026-09-22 由 WELLNESS 与 CAR 合并而来）。用户把它改名成 Gift Cards、
  # 清空原卡片，六张明写「礼品卡」的卡从 /topup/ 搬了过来；那十五张图集卡连图
  # 一起离开站点，旧 /style/ 指回首页。目录随之 git mv 到 docs/gift-cards/ ——
  # 这个 URL 2026-09-21 空出来过，这次原地复活。
  # 标签写 Gift Cards（源写法，nav 有 text-transform: uppercase，显示成
  # GIFT CARDS）—— **带空格的标签要 gen_home.py 认账**，那个正则 2026-09-24
  # 跟着放宽了，见 scripts/gen_home.py。
  - Gift Cards: gift-cards/index.md
  # 2026-09-24 改名：这一格原来叫 GEAR（乒乓球拍与装备实拍，11 组 67 张的灯箱
  # 图集，2026-09-22 加），整页由仓库外的 _tmp_ocr/gear_prep/prep.py 生成 ——
  # 那个生成器当天跟着退休，否则下次重跑就把 11 张卡写回来。用户把它改名成
  # CDKeys、清空原卡片，七张明写「充值卡 / 充值码」的卡从 /topup/ 搬了过来
  # （就是那页自己称作「7 种充值卡与卡密」的一组）；那 11 组实拍图连图一起离开
  # 站点，旧 /gear/ 指回首页。目录随之 git mv 到 docs/cdkeys/。位置不动：
  # 放在 Gift Cards 之后、FAQ 之前。
  - CDKeys: cdkeys/index.md
  # 2026-09-21 加：全站唯一一份「怎么买」的说明，不挂在任何商品类目下，
  # 自己是一个入口；放在最后，是这一排里唯一的帮助页。
  - FAQ: faq/index.md
  # SHOP 这一项 2026-09-21 删除：礼品卡搬进 /topup/ 之后，同一个页面挂在
  # TOP-UP 和 SHOP 两个标签下没有意义。2026-09-22 起首页也不再按 SHOP 分组 ——
  # scripts/gen_home.py 直接把这份 nav 当成类目表，每个类目取它页面上最新的
  # 6 张卡。所以这一行不只是导航，它是首页的输入。
