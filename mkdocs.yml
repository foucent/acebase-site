site_name: AceBase
# site_url is deliberately unset: no domain exists yet and this fork is local-only.
# A site_url would write a canonical URL for a site that is not live, and would
# turn every relative link into an absolute one on the preview port.
copyright: © 2026 AceBase.cc. All rights reserved.

theme:
  name: material
  custom_dir: overrides
  # Material's own UI strings: the search box placeholder, the search overlay,
  # the table-of-contents heading and the nav aria-labels.
  language: en
  # Material otherwise emits a <link> to Google Fonts on every page. The theme
  # is built on system stacks instead.
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    logo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - minify:
      # HTML minification strips attribute quotes. Keep CSS/JS minify only.
      minify_html: false
      minify_css: true
      minify_js: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  # uncrate loads after the first two: the magazine layout owns the
  # widest-reaching selectors, so it should win any specificity tie against
  # them. sourcing.css comes after those and gallery.css after it — the card
  # button has to beat the action line it sits in, and the count pill has to win
  # the corner of the frame against the band's own media rules.
  - stylesheets/extra.css
  - stylesheets/header.css
  - stylesheets/uncrate.css
  - stylesheets/sourcing.css
  - stylesheets/gallery.css
  - stylesheets/crisp.css
  # gear.css is scoped to .ab-sb (the home page's own wrapper — this was /gear/
  # until 2026-11-08) and last for the same reason as the rest: it lifts the
  # theme's 1000px content column.
  - stylesheets/gear.css
  # first-order.css is scoped to .ab-fo (/first-order/) and last for the same
  # reason: it lifts the theme's 1000px content column.
  - stylesheets/first-order.css

extra_javascript:
  # crisp.js first: sourcing.js hands its request to window.abOpenCrisp.
  - javascripts/crisp.js
  - javascripts/sourcing.js
  - javascripts/gallery.js
  - javascripts/digital.js
  # gear.js only runs on the page that has .ab-sb (the home page).
  - javascripts/gear.js

watch:
  - overrides

extra:
  # Material's footer prints "Made with Material for MkDocs" after the
  # copyright line unless this is false.
  generator: false
  # The row above the wordmark, copied 1:1 from acebase.cc (2026-11-01, 用户:
  # 「将 8000 的顶部样式，导航栏目以上的部分，1:1 从 8003 复制过来」). Same three
  # entries, same labels — text-transform: uppercase does the casing. The second
  # entry used to point at acebase.cc's /topup/, a page that no longer exists;
  # 2026-11-08 the user asked for it to lead home instead (「页面顶部的
  # shop.AceBase.cc 的链接要指向首页」), so it is "/" now — the front page of
  # whichever host serves the row. The third entry (@AceBase) was written into
  # header.html next to the logo, as on acebase, and came out on 2026-11-02.
  family:
    - label: AceBase.cc
      link: https://acebase.cc/
    - label: shop.AceBase.cc
      link: /

nav:
  # The gear page became the front door on 2026-11-08 (user: 「将 /gear/ 改成 /」).
  # The old address is not kept as a redirect — this workspace retires addresses.
  # STACK became GUIDES on 2026-11-08 (user: 「将导航和目录 stack改为guides」),
  # old address 404 as usual. Later the same day (「/game/ 改名为 Top-ups，
  # gift cards 改名为 gift-cards，/top-up/ 改名为 news」): TOP-UP → NEWS (now
  # the last catalogue entry), GIFT CARDS → GIFT-CARDS, GAME → TOP-UPS (now
  # second). /top-up/ and /game/ are 404 too — no redirects.
  # Still later (「将 news的商品移到 …/top-ups/，并将 top-ups/改名为 Top ups」):
  # the two live top-ups left /news/ for /top-ups/, whose label lost its hyphen
  # — TOP UPS. NEWS keeps its fifth slot.
  # 2026-11-08, last word on the label (user: 「TOP UPS 改成 TOP-UPS」): the
  # hyphen is back — TOP-UPS — and with it the page title and aria-label read
  # Top-ups. The address was always /top-ups/ and does not change.
  # 2026-11-11 (user: 「将 /top-ups/ 的商品移至 /，商品只显示最低那一档的
  # 价格」): the nineteen products moved onto the home shelf and the page was
  # deleted, so TOP-UPS leaves the nav — five entries now. /top-ups/ is 404,
  # no redirect, like every address this workspace has retired. Its one detail
  # page stays at /top-ups/pubg-mobile/, linked from the PUBG card's title.
  # Same day, same treatment for the other two catalogues (user: 「将 /cdkeys/
  # 和 /gift-cards/ 也同样处理」): their seventeen products moved onto the home
  # shelf, both pages were deleted and both nav entries went with them — three
  # entries now, HOME / NEWS / GUIDES. /cdkeys/ and /gift-cards/ are 404, no
  # redirect.
  # 2026-11-11 (user: 「https://www.panli.com/helps/daigou 模仿这个页面 新增
  # 一个页面，并在导航中展示」): FIRST ORDER joins the nav right after HOME —
  # the page is /first-order/, the first-order walkthrough. The reference site
  # is not named on the page.
  - HOME: index.md
  - FIRST ORDER: first-order/index.md
  - NEWS: news/index.md
  - GUIDES: guides/index.md
