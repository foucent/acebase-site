site_name: AceBase
site_url: https://acebase.cc/
theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    logo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - minify:
      # HTML minification strips attribute quotes, breaking data-gallery JSON
      # attributes used by the photo-wall lightbox. Keep CSS/JS minify only.
      minify_html: false
      minify_css: true
      minify_js: true
  - redirects:
      redirect_maps:
        board-games.md: gallery/peripherals.md
        peripherals.md: gallery/peripherals.md
        keyboards.md: gallery/peripherals.md
        keycaps.md: gallery/peripherals.md
        mousepads.md: gallery/peripherals.md
        guides/safety.md: legal/safety.md
        gallery/coser.md: gallery/figures.md
        gallery/pre-owned.md: gallery/figures.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/offgamers-pubg.css
  - stylesheets/bittopup-product.css
  - stylesheets/preowned.css
  - stylesheets/photo-wall.css
  - stylesheets/home.css
  - stylesheets/board-games.css
  - stylesheets/games.css

extra_javascript:
  - javascripts/currency.js
  - javascripts/crisp.js
  - javascripts/hero-slides.js
  - javascripts/photo-wall.js
  - javascripts/gallery-lightbox.js
  - javascripts/board-cart.js
  - javascripts/board-grid.js
  - javascripts/games-prices.js

watch:
  - overrides

