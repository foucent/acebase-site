site_name: AceBase
site_url: https://acebase.cc/
theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    logo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 中文
          build: true
          nav:
            - 首页: index.md
            - 价格:
                - PUBG Mobile: games/pubg-mobile.md
                - PUBG G-COIN: games/pubg-gcoin.md
            - 租赁:
                - 三角洲行动: games/delta-force.md
            - 画廊: gallery/index.md
            - 关于:
                - 常见问题与更新: shop/faq-and-updates.md
                - 发货与配送: shop/shipping-and-delivery.md
                - 充值安全指南: legal/safety.md
                - 退货政策: legal/return-policy.md
                - 反洗钱政策: legal/aml-policy.md
                - 使用条款: legal/terms-of-use.md
  - search
  - minify:
      # HTML minification strips attribute quotes, breaking data-gallery JSON
      # attributes used by the photo-wall lightbox. Keep CSS/JS minify only.
      minify_html: false
      minify_css: true
      minify_js: true
  - redirects:
      redirect_maps:
        board-games.md: gallery/index.md
        peripherals.md: gallery/index.md
        keyboards.md: gallery/index.md
        keycaps.md: gallery/index.md
        mousepads.md: gallery/index.md
        gallery/wallpapers.md: gallery/index.md
        gallery/peripherals.md: gallery/index.md
        gallery/figures.md: gallery/index.md
        gallery/coser.md: gallery/index.md
        gallery/pre-owned.md: gallery/index.md
        games/honor-of-kings.md: games/pubg-mobile.md
        games/steam-accounts.md: games/delta-force.md
        games/valorant-accounts.md: games/delta-force.md
        currency/index.md: index.md
        games/buy-robux.md: index.md
        guides/safety.md: legal/safety.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/offgamers-pubg.css
  - stylesheets/bittopup-product.css
  - stylesheets/preowned.css
  - stylesheets/photo-wall.css
  - stylesheets/home.css
  - stylesheets/board-games.css
  - stylesheets/games.css
  - stylesheets/currency.css

extra_javascript:
  - javascripts/currency.js
  - javascripts/crisp.js
  - javascripts/hero-slides.js
  - javascripts/photo-wall.js
  - javascripts/gallery-lightbox.js
  - javascripts/board-cart.js
  - javascripts/board-grid.js
  - javascripts/games-prices.js
  - javascripts/delta-force-pager.js

watch:
  - overrides

extra:
  # Snipcart v3 public API key (Test key while testing; Live key after going live).
  # Get it at https://app.snipcart.com → Account → API keys.
  # See https://docs.snipcart.com/v3/testing/going-live
  snipcart_public_key: "MjA4M2Y2NmMtMjBmNi00Y2Q4LThlNzYtNDA1ZDhlNTU0OTQ2NjM5MjAxNTQ1NTQwOTM1OTI4"
  analytics:
    provider: google
    property: G-Q77Y59HQ7K
  social:
    - icon: material/controller-classic
      link: https://acebase.cc/
      name: AceBase
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@acebase
      name: AceBase on YouTube
    - icon: fontawesome/brands/discord
      link: https://discord.gg/acebase
      name: AceBase on Discord

nav:
  - Home: index.md
  - Prices:
      - PUBG Mobile: games/pubg-mobile.md
      - PUBG G-COIN: games/pubg-gcoin.md
  - Rental:
      - Delta Force Accounts: games/delta-force.md
  - Gallery: gallery/index.md
  - About:
      - FAQ & Updates: shop/faq-and-updates.md
      - Delivery: shop/shipping-and-delivery.md
      - Top-Up Safety Guide: legal/safety.md
      - Return Policy: legal/return-policy.md
      - AML / CTF Policy: legal/aml-policy.md
      - Terms of Use: legal/terms-of-use.md
