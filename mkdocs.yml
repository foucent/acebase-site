site_name: AceBase
site_url: https://acebase.cc/
# Rendered by Material's partials/copyright.html in the footer bar.
copyright: © 2026 AceBase.cc. All rights reserved.
theme:
  name: material
  custom_dir: overrides
  # 2026-10-25 从 zh 改成 en（用户：「页面上的搜索框也要改为英文版本」）。这一项
  # 决定 Material 自己的界面文案：搜索框占位符、搜索弹层（搜索 / 查找 / 清空当前
  # 内容 / 正在初始化搜索引擎）、右侧目录标题「目录」、以及 aria-label「导航栏 /
  # 标签」——全是中文，而站内正文 2026-09-22 起已全英文，页头 nav 也是英文。
  # 顺带把 <html lang> 从 zh 改回 en，搜索引擎才按英文页收录。**不要改回去**：
  # 站上没有 i18n 插件，这一行是界面语言唯一的开关。
  language: en
  # Material otherwise emits a <link> to Google Fonts for Roboto / Roboto Mono
  # on every page. The theme is built on system stacks instead, and the site is
  # read mainly from mainland China, where that request just stalls.
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    logo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - minify:
      # HTML minification strips attribute quotes, breaking data-gallery JSON
      # attributes used by the photo-wall lightbox. Keep CSS/JS minify only.
      minify_html: false
      minify_css: true
      minify_js: true
  - redirects:
      redirect_maps:
        board-games.md: gallery/index.md
        peripherals.md: gallery/index.md
        keyboards.md: gallery/index.md
        keycaps.md: gallery/index.md
        mousepads.md: gallery/index.md
        gallery/wallpapers.md: gallery/index.md
        gallery/peripherals.md: gallery/index.md
        gallery/figures.md: gallery/index.md
        gallery/coser.md: gallery/index.md
        gallery/pre-owned.md: gallery/index.md
        # 2026-10-21：五个游戏详情页与 honor-of-kings 的存根从 /topup/ 改指
        # /games/ —— 那一格新增 GAME 类目，5 张游戏卡整块搬过去，卡片 id 没改，
        # 所以存根带着锚点跳过去仍然落在卡上（/games/hok/#hok → /games/#hok）。
        games/honor-of-kings.md: games/index.md
        games/steam-accounts.md: index.md
        games/valorant-accounts.md: index.md
        currency/index.md: index.md
        games/buy-robux.md: index.md
        # 显卡相关的十个旧 URL 2026-09-22 起全部指 /games/gpu-deals/ —— /gear/
        # （当时叫 /tech/）从这一天起是电竞房与桌搭实拍图集，不再讲任何显卡价，
        # 全站还在讲显卡价的只剩这一页。下面八个型号页是 2026-09-21 下线的，
        # 当初指回当时的总览页。
        games/rtx-5050.md: games/gpu-deals.md
        games/gpu-prices.md: games/gpu-deals.md
        games/rtx-5060.md: games/gpu-deals.md
        games/rtx-5060-ti.md: games/gpu-deals.md
        games/rtx-4070-ti-super.md: games/gpu-deals.md
        games/rtx-4080.md: games/gpu-deals.md
        games/rtx-4080-super.md: games/gpu-deals.md
        games/rtx-4090.md: games/gpu-deals.md
        games/rtx-3060.md: games/gpu-deals.md
        games/rtx-3060-ti.md: games/gpu-deals.md
        # 代储价格页 2026-09-21 从 /games/topup-prices/ 提到顶层 /topup/，
        # 和 /gear/（当时叫 /tech/）并列。旧 URL 指过去，免得留下 404。
        # **2026-10-21 改指 /games/**：代储卡（含各游戏锚点）搬到了新类目，
        # 停在 /topup/ 就落不到卡上了。
        games/topup-prices.md: games/index.md
        # 五个游戏详情页 2026-09-21 下线 —— /topup 的卡片自己就把档位和价格列全了，
        # 详情页只是同一份数据的第二个入口。旧 URL 指回总览页对应那张卡的锚点。
        # **2026-10-21 总览页换成 /games/**（同上，卡片 id 没改，锚点仍然有效）。
        games/pubg-mobile.md: games/index.md
        games/pubg-gcoin.md: games/index.md
        games/hok.md: games/index.md
        games/arena-breakout.md: games/index.md
        games/where-winds-meet.md: games/index.md
        # `gift-cards/index.md: topup/index.md` 与 `cdkeys/index.md:
        # topup/index.md` 两条 2026-09-21 曾在这一行（当时礼品卡与充值码都是
        # /topup 的第二、三段），2026-09-24 两页各自立成类目时删掉 —— 地址上了
        # 真页面，留存根会把页面自己顶走。**2026-10-13 两条又都补回来了**
        # （/gift-cards/ 那条 2026-10-21 再删掉，见下面）：
        # 那一天 /gift-cards/（6 张）与 /cdkeys/（7 张）整体并回 /topup/，
        # 两个目录连页面一起删掉，URL 只剩存根。mkdocs-redirects 的存根会
        # **带着锚点**跳（`location.href = "../topup/" + (anchor ? "#"+anchor : "")`），
        # 而这十三张卡的 id 一个都没改，所以 `/cdkeys/#gocash-card`
        # → `/topup/#gocash-card` 落得到卡片上。
        # 直播代储页 2026-09-21 整页下线 —— 十四个平台按同一张模板重排，成了
        # /topup 的第三段；这一页的生成器、渲染器、样式和数据文件一并退休，
        # 价格改由 prices.json 供。旧 URL 指过去。
        games/live-prices.md: topup/index.md
        # 2026-10-13：礼品卡与充值码两个类目并回 /topup/，两页的地址只剩存根
        # （理由与锚点见上面 gift-cards 那一段）。**这条不能省** —— 页面删了
        # 而存根不补，/cdkeys/ 直接 404。
        #
        # /gift-cards/ 2026-10-21 又变回真页面（nav 的 SOURCING 一格换成 GIFT
        # CARDS），所以它这条**删掉** —— 留着会像 09-24 那次一样把新页顶走。
        #
        # 2026-10-22：/topup/ 换成娱乐代储 30 款，七张充值码卡全站撤掉，原来
        # 指过去的存根（带 `#gocash-card` 这类锚点）会落到一张不存在的卡上。
        # 码卡与礼品卡同属数字码，所以这条改指 /gift-cards/（六张礼品卡都在
        # 那一页）。
        cdkeys/index.md: gift-cards/index.md

        # /sourcing/ 2026-10-21 换成 Gift Cards（用户：「将 /sourcing/ 改为
        # Gift Cards，包括链接」）：八张手办卡整页删掉，这个 URL 改指新页面；
        # 六张礼品卡是从 /topup/ 复制过去的，id 没改，所以 /sourcing/#amazon-
        # gift-card-us 这类新地址的锚点也落得到卡上。
        sourcing/index.md: gift-cards/index.md
        # NEWS 2026-10-21 改名 BLOG（用户：「将News改为blog」）：目录 git mv 到
        # docs/blog/，地址 /news/ → /blog/，这一条就是 /news/ 的存根。改名那天
        # 页面内容没变、卡片 id 没变，存根带锚点跳（/news/#... → /blog/#...）
        # 落得到卡；2026-10-22 那页换成九行资讯列表之后 `#haruo-news-card` 已经
        # 不在，旧锚点只剩跳转本身 —— 落在页面顶部，不落在 404 上。同一天九条
        # 正文各自独立成页，行 id 没变（/news/#delta-force-ammo → /blog/#delta-
        # force-ammo 仍落在那一行），正文本身则要再点 Read article。
        news/index.md: blog/index.md
        # FAQ 2026-10-21 整页撤掉（用户：「删除FAQ」，问过之后选的是导航和页面
        # 一起删）：docs/faq/ 连页面删除，/faq/ 指回首页 —— 跟 /services/、
        # /style/ 同一种处置，谁跟过来都找不到原来的内容，至少不落在 404 上。
        faq/index.md: index.md
        # 旧 FAQ 页（f8b7ba5 随 shop 目录一起下线）一直没人接手，URL 是 404；
        # 它原先指 /faq/。**2026-10-21 /faq/ 也撤了**，改指首页 —— 指存根会多
        # 一跳（/shop/faq-and-updates/ → /faq/ → /）。
        shop/faq-and-updates.md: index.md
        # /car/ 2026-09-22 并入当时的 /sim-gear/（后来叫 /style/）—— 汽车实拍
        # 图集不再单独成类目，六张卡进了那一页的同一个网格。这一行当时指回首页
        # 是一处旧账（六张卡在 /style/ 上，指 style/index.md 才能让 /car/#car-01
        # 落到 car-01 那张卡）。2026-09-24 这笔账自己结了：STYLE 整页改成了
        # Gift Cards，十五张图集卡连图一起离开站点，car-01…06 哪儿都不在了 ——
        # 指首页现在是对的目标。
        car/index.md: index.md
        # /style/ 2026-09-24 整页让位 —— STYLE（穿搭写真 9 套 + 汽车实拍 6 套的
        # 图集）被用户改名成 Gift Cards，原来的十五张卡与 docs/assets/gallery/
        # 下的图一并撤掉，页面在同一个目录上重写成礼品卡（docs/gift-cards/）。
        # 那十五张卡连同锚点全没了，指回首页 —— 跟 /wellness/ 同一种处置：
        # 谁跟过来都找不到原来的照片，至少不落在 404 上。
        style/index.md: index.md
        # /sim-gear/ 2026-09-23 改名 /style/，2026-09-24 那页又整个换成了
        # Gift Cards。当初改指 style/index.md 是为了让 /sim-gear/#style-05
        # 落到那张卡上（mkdocs-redirects 的存根会**带着锚点**跳：
        # `location.href = "../style/" + (anchor ? "#" + anchor : "")`，
        # 浏览器实测 /sim-gear/#style-05 → /style/#style-05）—— 那些锚点现在
        # 不在了，所以跟着 /style/ 一起指首页。
        sim-gear/index.md: index.md
        # /gear/ 2026-09-24 上午整页让位 —— GEAR（乒乓球拍与装备实拍 11 组 67 张）
        # 被用户改名成 CDKeys，原来的十一张图集卡与 docs/assets/gallery/gear/ 下的
        # 67 张图一并撤掉，页面在同一个目录上重写成充值卡（docs/cdkeys/）。那些卡
        # 连同锚点全没了，当时指回首页 —— 跟 /style/、/wellness/ 同一种处置。
        # **同一天下午这一行删掉了**：/tech/ 改名 /gear/，这个 URL 从「旧地址」
        # 变回正式地址，留着存根只会把新页面顶走。下面那条指过去的跳转取而代之。
        #
        # /figures/ 2026-10-20 改名 —— 当天先从 FIGURES 改成 PROXY BUY（「改为
        # 代购」，目录 git mv 到 docs/proxy-buy/），随后标签改成 SOURCING、路径
        # 也跟着 git mv 到 docs/sourcing/。**八张卡的 id 一直没动**，所以这条
        # 存根两次都带着锚点跳（`/figures/#gear-13` → `/sourcing/#gear-13`），
        # 目标页上有同名 id，老锚点照样落在卡片上。目标直接指 /sourcing/，不指
        # 已经作废的 /proxy-buy/ 存根，否则多一跳。**2026-10-21 目标改成首页**：
        # /sourcing/ 换成 Gift Cards，八张手办卡整页删掉，锚点无处可落，和
        # /style/ 同一种处置。
        figures/index.md: index.md
        # /proxy-buy/ 同一天又改名为 /sourcing/（用户：「将链接要改成 SOURCING」）。
        # 这一条就是那一次的补偿 —— 页面只存在了几小时，但 URL 可能已经被人拿到。
        # 2026-10-21 与 figures/ 同步改指首页。
        proxy-buy/index.md: index.md
        # /gear/ 2026-10-06 改名 /figures/ —— 栏目名先改成 FIGURES，用户随后要求
        # 「路径也要改的和栏目名一样」，于是目录 git mv 到 docs/figures/。**这条
        # 存根就是那一次的补偿**：/gear/ 从正式地址变回旧地址，不补就是 404。
        # 锚点照旧会带过去（`/gear/#gear-13` → `/figures/#gear-13`），而卡片 id
        # 这次**没跟着改**，所以锚点仍然有效 —— 这与 /tech/ 那次不同（那次 id
        # 从 desk-NN 改成 gear-NN，老锚点全废）。
        # **2026-10-20 起目标改成 /sourcing/**，理由同上一条：卡片 id 没动，
        # 锚点仍然有效；不跟着改就会多一跳（/gear/ → /figures/ → /sourcing/）。
        # 2026-10-21 与 figures/ 同步改指首页。
        gear/index.md: index.md
        #
        # /tech/ 2026-09-24 下午 改名为 /gear/ —— 这一格从 TECH 改名 GEAR，卡片 id 与
        # 图片名也从 desk-NN / desk_NN_MM.jpg 换成 gear-NN / gear_NN_MM.jpg。
        # **指 /gear/ 而不是首页**：内容搬到哪就指哪，十二张卡在新页上都在。唯一
        # 的损失是锚点 —— 锚点跟着卡片改名（#desk-05 → #gear-05），存根虽然会把
        # 老锚点带过去（location.href="../gear/" + "#desk-05"），但新页没有
        # #desk-05 这个元素，浏览器停在页首。页级跳转仍然是赚的。
        #
        # 2026-10-06：这一行跟着页面路径改名改成 `figures/index.md` —— 那一格
        # 当天先改名 FIGURES（标签），随后路径也改成 /figures/。指错就等于把
        # /tech/ 这样的老 URL 送进一个不存在的页面。**2026-10-20 又跟着改成
        # sourcing/index.md。**
        # 2026-10-21 与 figures/ 同步改指首页。
        tech/index.md: index.md

        # /wellness/ 2026-09-22 删除 —— 「健康生活」筹备页从没有过卡片，也没上过
        # 首页，没有内容可以搬。
        wellness/index.md: index.md

        # /services/ 2026-10-21 删除 —— 用户要求整页连同导航一起去掉。六张电脑
        # 调试卡（每项 $9.9）没有搬到别的页，所以指回首页，和 /style/、/car/、
        # /sim-gear/、/wellness/ 同一种处置。图片没删，仍在
        # docs/assets/services/ 下；卡片样式 ab-card--service 还在 /boosting/ 用。
        services/index.md: index.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/header.css
  - stylesheets/preowned.css
  - stylesheets/photo-wall.css
  - stylesheets/home.css
  - stylesheets/board-games.css
  - stylesheets/games.css
  - stylesheets/gift-cards.css
  # gpu.css was retired 2026-09-21 with the /games/live-prices/ page: the only
  # class left in it, .mg-gpu-models, was that page's anchor-pill row.
  # Loads last: the magazine homepage owns the widest-reaching selectors, so
  # it should win any specificity tie against the per-page sheets above.
  - stylesheets/uncrate.css
  # /boosting/ only. Scoped to .ab-boost* inside .ab-mag.
  - stylesheets/boosting.css

extra_javascript:
  - javascripts/crisp.js
  - javascripts/hero-slides.js
  - javascripts/photo-wall.js
  - javascripts/gallery-lightbox.js
  - javascripts/board-cart.js
  - javascripts/board-grid.js
  - javascripts/gift-cards.js
  # live-prices.js was retired 2026-09-21 with the page it served: its
  # .ab-ec-list[data-product] targets are gone and /topup renders every card,
  # these fourteen included, through games-prices.js.
  - javascripts/games-prices.js
  # /boosting/ configurator; exits unless [data-boost-root] is on the page.
  - javascripts/boosting.js

watch:
  - overrides

extra:
  # Snipcart v3 public API key (Test key while testing; Live key after going live).
  # Get it at https://app.snipcart.com → Account → API keys.
  # See https://docs.snipcart.com/v3/testing/going-live
  snipcart_public_key: "MjA4M2Y2NmMtMjBmNi00Y2Q4LThlNzYtNDA1ZDhlNTU0OTQ2NjM5MjAxNTQ1NTQwOTM1OTI4"
  analytics:
    provider: google
    property: G-N7QW2VCWYG
  # uncrate's family row, in the black band above the wordmark: the sibling
  # sites. header.html renders the chat opener after them. Labels go through
  # text-transform: uppercase, so write them in the brand's own casing.
  # `link` takes a full URL or a site-root path.
  family:
    - label: AceBase.cc
      link: https://acebase.cc/
    # 站内的商品专区 —— 2026-09-21 起是 /topup/ 的第二段，2026-09-24 起礼品卡
    # 搬出来自己成了一个类目 /gift-cards/，这一格跟着改指那边；**2026-10-13
    # 礼品卡与充值码两页并回 /topup/，这一格跟着指回 /topup/**。
    # shop.acebase.cc 解析不了，子域开通后把 link 换成
    # https://shop.acebase.cc/ 即可。
    - label: shop.AceBase.cc
      link: /topup/
  # The site's own channels, read once, by main.html, which declares them as
  # the Organization node's sameAs. header.html used to render them as a menu
  # under the @AceBase handle in the family row; from 2026-09-23 that handle
  # opened the chat window instead, and **from 2026-10-25 it is a plain link to
  # the second channel below** (用户：「需要将网站顶部的@AceBase 链接到
  # https://www.youtube.com/@AceBase_cc」) — the href is written into
  # header.html directly, this list is only read by main.html now. `name` is
  # the label.
  #
  # Deliberately NOT named `social`: Material prints extra.social as a row of
  # icons in the footer, and the footer carries the copyright line alone.
  channels:
    - link: https://www.youtube.com/@acebase.select
      name: acebase.select
    - link: https://www.youtube.com/@AceBase_cc
      name: AceBase_cc
    - link: https://www.youtube.com/@经典好车
      name: 经典好车
  # Material's footer prints "Made with Material for MkDocs" after the copyright
  # unless this is false.
  generator: false

nav:
  # 2026-10-21：导航重排（用户：「将导航按 top-up , game,gift cards,BOOSTING,news
  # 进行排序，并将News改为blog，删除FAQ」）。现在的顺序是 **TOP-UP / GAME /
  # GIFT CARDS / BOOSTING / BLOG**。同一天还做了两件事：NEWS 改名 **BLOG**
  # （目录 git mv 到 docs/blog/，地址 /news/ → /blog/，/news/ 出存根），FAQ
  # 整页撤掉（docs/faq/ 删除，/faq/ 出存根指首页）。各格的历史注释跟着自己
  # 那一格走，没有重写。
  #
  # 重排会影响首页，所以同一天把 gen_home.py 的去重规则也改了：它把这份 nav
  # 当类目表，而同一张卡只能上首页一次。原先「nav 里靠前的类目留下重复卡」，
  # TOP-UP 排到 GIFT CARDS 前面后会把六张礼品卡全占掉、GIFT CARDS 一格都上
  # 不了首页（22 → 16）。新规则是 **重复卡归卡片更少的那个类目**（/gift-cards/
  # 6 张 < /topup/ 13 张），与顺序无关；计数仍是 TOP-UP 6 + GAME 5 +
  # GIFT CARDS 6 + BOOSTING 4 + BLOG 1 = 22。
  #
  # 2026-10-22：/topup/ 的十三张卡整批换成 topuplist entertainment 分类精选的
  # 30 款（直播 / 语音房 / 社交 App 代储）。六张礼品卡在 /gift-cards/ 有自己的
  # 副本、不受影响；七张充值卡（Fortnite / Apex / PlayStation / Switch Online /
  # eShop / Steam / GoCash）全站撤掉，只在 prices.json 里留档。去重规则没变，
