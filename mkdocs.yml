site_name: AceBase
# site_url is deliberately unset: no domain exists yet and this fork is local-only.
# A site_url would write a canonical URL for a site that is not live, and would
# turn every relative link into an absolute one on the preview port.
copyright: © 2026 AceBase.cc. All rights reserved.

theme:
  name: material
  custom_dir: overrides
  # Material's own UI strings: the search box placeholder, the search overlay,
  # the table-of-contents heading and the nav aria-labels.
  language: en
  # Material otherwise emits a <link> to Google Fonts on every page. The theme
  # is built on system stacks instead.
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    logo: material/controller-classic
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - minify:
      # HTML minification strips attribute quotes. Keep CSS/JS minify only.
      minify_html: false
      minify_css: true
      minify_js: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  # uncrate loads after the first two: the magazine layout owns the
  # widest-reaching selectors, so it should win any specificity tie against
  # them. cart.css comes after those and gallery.css after it — the card button
  # has to beat the action line it sits in, and the count pill has to win the
  # corner of the frame against the band's own media rules.
  - stylesheets/extra.css
  - stylesheets/header.css
  - stylesheets/uncrate.css
  - stylesheets/cart.css
  - stylesheets/gallery.css
  - stylesheets/crisp.css

extra_javascript:
  # crisp.js first: cart.js hands a cart to window.abOpenCrisp.
  - javascripts/crisp.js
  - javascripts/cart.js
  - javascripts/gallery.js
  - javascripts/digital.js

watch:
  - overrides

extra:
  # Material's footer prints "Made with Material for MkDocs" after the
  # copyright line unless this is false.
  generator: false
  # The row above the wordmark, copied 1:1 from acebase.cc (2026-11-01, 用户:
  # 「将 8000 的顶部样式，导航栏目以上的部分，1:1 从 8003 复制过来」). Same three
  # entries, same labels — text-transform: uppercase does the casing. The second
  # entry points at acebase.cc's /topup/ rather than a bare /topup/, because
  # this site has no such page and the row must not carry a dead link. The third
  # entry (@AceBase) is written into header.html next to the logo, as on acebase.
  family:
    - label: AceBase.cc
      link: https://acebase.cc/
    - label: shop.AceBase.cc
      link: https://acebase.cc/topup/

nav:
  - DESIRE: desire/index.md
  - GROOM: groom/index.md
  - GEAR: gear/index.md
  - WORKSHOP: workshop/index.md
  - GAME: game/index.md
  - STACK: stack/index.md
  - SERVICES: services/index.md
