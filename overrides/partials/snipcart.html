<script>
  (function () {
    var title = {{ config.extra.snipcart_deferred_title | default("Pay with Wise") | tojson }};
    var instructions = {{ config.extra.snipcart_deferred_instructions | default("") | tojson }};
    var wiseHint = {{ config.extra.snipcart_wise_hint | default("") | tojson }};
    var waNumber = {{ config.extra.snipcart_whatsapp | default("8618627156285") | tojson }};
    if (wiseHint) {
      instructions = instructions + (instructions ? " " : "") + wiseHint;
    }

    function money(n) {
      var v = Number(n);
      if (isNaN(v)) return String(n);
      return "US$ " + v.toFixed(2);
    }

    function isDeferredOrder(cart) {
      if (!cart) return false;
      var status = String(cart.paymentStatus || cart.payment_status || "");
      var method = String(cart.paymentMethod || cart.payment_method || "");
      return /deferred/i.test(status) || /deferred|wise/i.test(method);
    }

    function buildWhatsAppText(cart) {
      var invoice =
        cart.invoiceNumber ||
        cart.token ||
        cart.orderToken ||
        cart.number ||
        "";
      var email =
        (cart.email ||
          (cart.user && cart.user.email) ||
          (cart.billingAddress && cart.billingAddress.email) ||
          "") + "";
      var name =
        (cart.billingAddress &&
          ((cart.billingAddress.fullName ||
            [cart.billingAddress.name, cart.billingAddress.surname]
              .filter(Boolean)
              .join(" ")) ||
            "")) ||
        "";
      var total =
        cart.total != null
          ? cart.total
          : cart.grandTotal != null
            ? cart.grandTotal
            : "";
      var currency = (cart.currency || "usd").toUpperCase();
      var lines = [
        "Hi, I placed a Wise (deferred) order on AceBase:",
        "Order: " + (invoice || "(pending)"),
        name ? "Name: " + name : "",
        email ? "Email: " + email : "",
        "Total: " +
          (total !== "" ? money(total) : "") +
          (currency ? " " + currency : ""),
        "",
        "Items:",
      ].filter(Boolean);

      var items = cart.items || cart.cartItems || [];
      if (items && items.length) {
        items.forEach(function (it, i) {
          var q = it.quantity != null ? it.quantity : 1;
          var p = it.totalPrice != null ? it.totalPrice : it.price;
          lines.push(
            i +
              1 +
              ". " +
              (it.name || it.id || "Item") +
              " × " +
              q +
              (p != null ? " = " + money(p) : "")
          );
        });
      } else {
        lines.push("(see Snipcart dashboard)");
      }

      lines.push("");
      lines.push(
        "I will send the Wise transfer with this order number as the reference."
      );
      return lines.join("\n");
    }

    function openWhatsApp(text) {
      var url =
        "https://wa.me/" +
        String(waNumber).replace(/\D/g, "") +
        "?text=" +
        encodeURIComponent(text);
      window.open(url, "_blank", "noopener,noreferrer");
    }

    document.addEventListener("snipcart.ready", function () {
      if (!window.Snipcart) return;

      if (Snipcart.api && Snipcart.api.session) {
        Snipcart.api.session.setLanguage("en", {
          payment: {
            form: {
              deferred_payment_title: title,
              deferred_payment_instructions: instructions
            },
            methods: {
              deferred_payment: title
            }
          }
        });
      }

      if (Snipcart.events && Snipcart.events.on) {
        Snipcart.events.on("cart.confirmed", function (cart) {
          try {
            if (!isDeferredOrder(cart)) return;
            openWhatsApp(buildWhatsAppText(cart || {}));
          } catch (e) {
            console.warn("AceBase WhatsApp order notify failed", e);
          }
        });
      }
    });
  })();
</script>
