{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <style>
    /* AceBase Google Translate floating button */
    #ab-translate-btn {
      position: fixed;
      right: 1rem;
      bottom: 1.2rem;
      z-index: 95;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      border: 0;
      border-radius: 999px;
      background: #7c3aed;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(124, 58, 237, 0.35);
    }
    #ab-translate-btn:hover { background: #6d28d9; }
    #ab-translate-box {
      position: fixed;
      right: 1rem;
      bottom: 3.6rem;
      z-index: 96;
      display: none;
      padding: 0.6rem;
      border-radius: 0.6rem;
      background: #1c1c1f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    #ab-translate-box.is-open { display: block; }
    #ab-translate-box .skiptranslate { display: none; }
    #google_translate_element { color: #e2e8f0; }
    #google_translate_element select {
      background: #141416;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.35rem;
      padding: 0.3rem 0.4rem;
      font-size: 0.78rem;
    }
    @media (max-width: 700px) {
      #ab-translate-btn { right: 0.75rem; bottom: 1rem; }
      #ab-translate-box { right: 0.75rem; bottom: 3.4rem; }
    }
  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>window.AB_SNIPCART_KEY = {{ config.extra.snipcart_public_key | default("") | tojson }};</script>
  <script>
    (function () {
      function initTranslate() {
        if (!window.google || !window.google.translate) return;
        new window.google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "zh-CN,en,ja,ko,es,fr,de,ru",
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          },
          "google_translate_element"
        );
      }
      var btn = document.createElement("button");
      btn.id = "ab-translate-btn";
      btn.type = "button";
      btn.innerHTML = "🌐 Translate";
      document.body.appendChild(btn);
      var box = document.createElement("div");
      box.id = "ab-translate-box";
      box.innerHTML = '<div id="google_translate_element"></div>';
      document.body.appendChild(box);
      btn.addEventListener("click", function () {
        box.classList.toggle("is-open");
        if (!window.google || !window.google.translate) {
          var s = document.createElement("script");
          s.src = "https://translate.google.com/translate_a/element.js?cb=acebaseTranslateReady";
          s.async = true;
          document.head.appendChild(s);
          window.acebaseTranslateReady = initTranslate;
        }
      });
      document.addEventListener("click", function (e) {
        if (!e.target.closest("#ab-translate-btn") && !e.target.closest("#ab-translate-box")) {
          box.classList.remove("is-open");
        }
      });
    })();
  </script>
{% endblock %}
