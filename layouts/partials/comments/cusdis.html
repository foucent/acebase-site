{{ with .Site.Params.cusdis }}
<div id="cusdis_thread"
  data-host="{{ .host | default "https://cusdis.com" }}"
  data-app-id="{{ .appId }}"
  data-page-id="{{ $.RelPermalink }}"
  data-page-url="{{ $.Permalink }}"
  data-page-title="{{ $.Title }}"
  {{ with .lang }}data-lang="{{ . }}"{{ end }}
></div>
<script async defer src="{{ .host | default "https://cusdis.com" }}/js/cusdis.es.js"></script>
<script>
(function () {
  var thread = document.getElementById("cusdis_thread");
  if (!thread) return;

  function tuneIframe() {
    var iframe = thread.querySelector("iframe");
    if (!iframe) return;
    iframe.style.overflow = "hidden";
    var height = parseInt(iframe.style.height, 10);
    if (!height || height < 320) {
      iframe.style.minHeight = "520px";
    }
  }

  new MutationObserver(tuneIframe).observe(thread, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ["style"]
  });

  window.addEventListener("message", function (event) {
    try {
      var msg = JSON.parse(event.data);
      if (msg.from === "cusdis" && msg.event === "resize") {
        tuneIframe();
      }
    } catch (e) {}
  });

  tuneIframe();
})();
</script>
{{ end }}
