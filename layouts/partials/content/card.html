<article class="relative group bg-zinc-100 hover:bg-blue-100 rounded-3xl h-full flex flex-col">
    
    <a class="insert-link" href="{{ .Permalink }}"></a>

    <figure class="w-full aspect-video overflow-hidden rounded-3xl bg-zinc-200">

        {{- if .Params.image }}
          {{- if (strings.HasPrefix .Params.image "http") }}
            <img class="object-cover group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ .Params.image }}" alt="{{ .Title }}" style="width: 100%; height: 100%; object-fit: cover;">
          {{- else if (strings.HasPrefix .Params.image "/") }}
            <img class="object-cover group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ .Params.image }}" alt="{{ .Title }}" style="width: 100%; height: 100%; object-fit: cover;">
          {{- else }}
            {{- with $imgcard := resources.Get .Params.image -}}
              {{- $imgcard := $imgcard.Process "resize 750x" -}}
              <img class="object-cover group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $imgcard.RelPermalink }}" alt="{{ .Title }}" width="{{ $imgcard.Width }}" height="{{ $imgcard.Height }}" style="width: 100%; height: 100%; object-fit: cover;">
            {{- end }}
          {{- end }}

        {{- else if .Params.youtube_id }}
          <img class="object-cover group-hover:scale-105 transition duration-500 cursor-pointer" 
               src="https://img.youtube.com/vi/{{ .Params.youtube_id }}/mqdefault.jpg" 
               alt="{{ .Title }}" 
               style="width: 100%; height: 100%; object-fit: cover;">

        {{- else }}
          <div class="w-full h-full flex items-center justify-center text-zinc-400 font-bold text-sm bg-zinc-200">
            📰 ARTICLE
          </div>
        {{- end }}

    </figure>

    <div class="p-6 flex flex-col flex-grow">
        <time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" | safeHTML }}">{{ .Date.Format "Jan 02, 2006" }}</time>

        <h3 class="my-4 text-2xl font-bold group-hover:text-blue-600 transition-colors">{{ .LinkTitle }}</h3>

        <p class="text-normal leading-normal text-zinc-500 line-clamp-2 mt-auto">{{ .Params.description }}</p>
    </div>
</article>
