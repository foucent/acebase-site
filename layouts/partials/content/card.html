<article class="relative group bg-zinc-100 hover:bg-blue-100 rounded-3xl h-full flex flex-col">
    
    <a class="insert-link" href="{{ .Permalink }}"></a>

    {{- $img := .Params.image -}}
    {{- $isPlayerAvatar := and $img (strings.HasPrefix $img "/images/player-config/") -}}
    <figure class="w-full {{ if $isPlayerAvatar }}aspect-square{{ else }}aspect-video{{ end }} overflow-hidden rounded-3xl bg-zinc-200">

        {{- if $img }}
          {{- if (strings.HasPrefix $img "http") }}
            <img class="group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $img }}" alt="{{ .Title }}" style="width: 100%; height: 100%; object-fit: {{ if $isPlayerAvatar }}contain{{ else }}cover{{ end }};{{ if $isPlayerAvatar }} object-position: top center;{{ end }}">
          {{- else if (strings.HasPrefix $img "/") }}
            <img class="group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $img }}" alt="{{ .Title }}" style="width: 100%; height: 100%; object-fit: {{ if $isPlayerAvatar }}contain{{ else }}cover{{ end }};{{ if $isPlayerAvatar }} object-position: top center;{{ end }}">
          {{- else }}
            {{- with $imgcard := resources.Get $img -}}
              {{- $imgcard := $imgcard.Process "resize 750x" -}}
              <img class="group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $imgcard.RelPermalink }}" alt="{{ .Title }}" width="{{ $imgcard.Width }}" height="{{ $imgcard.Height }}" style="width: 100%; height: 100%; object-fit: {{ if $isPlayerAvatar }}contain{{ else }}cover{{ end }};{{ if $isPlayerAvatar }} object-position: top center;{{ end }}">
            {{- end }}
          {{- end }}

        {{- else if .Params.youtube_id }}
          <img class="object-cover group-hover:scale-105 transition duration-500 cursor-pointer" 
               src="https://img.youtube.com/vi/{{ .Params.youtube_id }}/mqdefault.jpg" 
               alt="{{ .Title }}" 
               style="width: 100%; height: 100%; object-fit: cover;">

        {{- else }}
          <div class="w-full h-full flex items-center justify-center text-zinc-400 font-bold text-sm bg-zinc-200">
            📰 文章
          </div>
        {{- end }}

    </figure>

    <div class="p-6 flex flex-col flex-grow">
        <time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">{{ .Date.Format "2006年1月2日" }}</time>

        <h3 class="my-4 text-2xl font-bold group-hover:text-blue-600 transition-colors">{{ .LinkTitle }}</h3>

        <p class="text-normal leading-normal text-zinc-500 line-clamp-2 mt-auto">{{ .Params.description }}</p>
    </div>
</article>
