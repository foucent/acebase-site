<style>
.prose .ps-page { max-width: none; }
.prose .ps-page *:where(:not(.ps-value a)) { margin-top: 0; margin-bottom: 0; }
.ps-page { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #0a1d37; }
.ps-page * { box-sizing: border-box; }
.ps-card { background: #fff; border: 1px solid #e8ecf0; border-radius: 10px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(10, 29, 55, 0.04); }
.ps-section-title { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: #0a1d37; margin: 0 0 16px; }
.ps-section-title svg { flex-shrink: 0; }
.ps-divider { border: 0; border-top: 1px solid #eef1f5; margin: 16px 0; }
.ps-centered-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 8px 0 24px; color: #0a1d37; font-size: 1.5rem; font-weight: 700; }
.ps-centered-header::before, .ps-centered-header::after { content: ""; flex: 1; height: 1px; background: #dbe2ea; max-width: 200px; }
.ps-profile { display: grid; grid-template-columns: 96px 1fr auto; gap: 20px; align-items: start; }
.ps-avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #f0f4f8; }
.ps-profile-name { font-size: 1.75rem; font-weight: 800; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.ps-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid #eef1f5; }
.ps-info-item { padding: 12px 16px 12px 0; border-bottom: 1px solid #eef1f5; }
.ps-info-item:nth-child(odd) { padding-right: 24px; }
.ps-label { font-size: 12px; color: #8b95a5; margin-bottom: 4px; }
.ps-value { font-size: 15px; font-weight: 700; color: #0a1d37; }
.ps-value a { color: #2563eb; text-decoration: none; }
.ps-bio { font-size: 14px; color: #5c6b7a; line-height: 1.6; margin-top: 12px; }
.ps-social { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.ps-social a { color: #0a1d37; opacity: 0.7; }
.ps-product-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f0f4f8; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; flex-wrap: wrap; }
.ps-product-info { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 14px; }
.ps-product-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: contain; background: #fff; }
.ps-btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.ps-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid #dbe2ea; background: #fff; color: #0a1d37; text-decoration: none; }
.ps-btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
.ps-grid { display: grid; grid-template-columns: repeat(4, 1fr); }
.ps-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.ps-grid-item { padding: 16px 20px; border-bottom: 1px solid #eef1f5; }
.ps-grid-item .ps-value { font-size: 17px; }
.ps-subsection { font-size: 1rem; font-weight: 700; color: #0a1d37; margin: 8px 0 0; padding: 8px 20px 0; }
.ps-code { background: #f3f5f8; border-radius: 8px; padding: 14px 16px; font-family: Consolas, "Courier New", monospace; font-size: 13px; color: #334155; word-break: break-all; margin-top: 12px; }
.ps-card-actions { display: flex; gap: 8px; margin-left: auto; }
.ps-btn-sm { padding: 6px 12px; font-size: 12px; }
.ps-crosshair-preview { width: 100%; border-radius: 8px; margin: 12px 0 16px; display: block; }
.ps-gear-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.ps-gear-card { background: #f3f5f8; border-radius: 10px; padding: 16px; position: relative; min-height: 140px; display: flex; align-items: center; justify-content: center; }
.ps-gear-badge { position: absolute; top: 10px; right: 10px; background: #0a1d37; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; }
.ps-gear-img { max-width: 100%; max-height: 100px; object-fit: contain; }
.ps-gear-name { font-weight: 700; font-size: 14px; margin-top: 10px; color: #0a1d37; }
.ps-gear-sub { font-size: 13px; color: #5c6b7a; font-weight: 400; }
.ps-hw-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.ps-hw-card { background: #f3f5f8; border-radius: 10px; overflow: hidden; }
.ps-hw-img-wrap { padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 160px; position: relative; }
.ps-hw-name { padding: 12px 16px; font-weight: 700; font-size: 14px; }
.ps-skins-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.ps-skin-card { background: #f3f5f8; border-radius: 10px; padding: 16px; position: relative; min-height: 120px; display: flex; align-items: center; justify-content: center; }
.ps-skin-name { font-weight: 700; font-size: 13px; margin-top: 10px; line-height: 1.4; }
@media (max-width: 768px) {
  .ps-profile { grid-template-columns: 72px 1fr; }
  .ps-social { flex-direction: row; grid-column: 1 / -1; }
  .ps-grid, .ps-gear-grid, .ps-skins-grid { grid-template-columns: repeat(2, 1fr); }
  .ps-hw-grid { grid-template-columns: 1fr; }
}
</style>
